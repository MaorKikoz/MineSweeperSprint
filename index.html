<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <title>MineSweeper Project</title>
</head>

<body onload="onInit()">

  <h1>MineSweeper Sprint Project</h1>
  
  <div class="size-container">
    <h2>Difficulty</h2>
    <button onclick="onSetLevel(4, 2, 2)">Beginner</button>
    <button onclick="onSetLevel(8, 14 , 5)">Medium</button>
    <button onclick="onSetLevel(12, 32, 7)">Expert</button>
  </div>

  <div class="main-board">
    <div>
      <span class="flag"> Flags remaining: <span class="flags-remaining"></span> </span>
      || <span class="smiley-face" onclick="onInit()"></span>
      <span class="timer">00:000</span>
      <span class="healthbar"></span>
    </div>
    <div class="board-container">

    </div>
  </div>

  <div class="modal"> </div>


  <script src="js/util.js"></script>
  <script src="js/main.js"></script>
</body>
